[package]
name = "leaf-reader"
version = "0.14.0"
edition = "2024"
description = "Read PDFs, markdown files and web articles in the terminal"
license = "MIT"
repository = "https://github.com/DeepanshuMishraa/leaf"
readme = "README.md"
keywords = ["pdf", "reader", "terminal", "tui", "articles"]
categories = ["command-line-utilities"]
exclude = ["CLAUDE.md", "site"]

[[bin]]
name = "leaf"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
crossterm = "0.29"
dither-ratatui = "0.1.0"
dom_smoothie = "0.18"
htmd = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = "0.2"
mupdf = { version = "0.8", default-features = false, features = ["base14-fonts", "system-fonts", "epub", "svg"] }
mupdf-sys = { version = "0.8.0", default-features = false, features = ["epub", "svg"] }
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.30"
ratatui-image = { version = "12.0.0-rc.2", default-features = false, features = ["crossterm"] }
regex = "1"
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3"] }
thiserror = "2"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
unicode-ident = "1.0.27"
unicode-width = "0.2"
ureq = "3"
url = "2"
wasmtime = { version = "50.0.0", default-features = false, features = ["cranelift", "runtime", "std"] }

# Load fontconfig at run time instead of linking it, so building on Linux
# doesn't need its development package (libfontconfig1-dev). mupdf's
# system-fonts feature pulls it in through font-kit; this turns on font-kit's
# dlopen mode, which also sets yeslogic-fontconfig-sys/dlopen.
[target.'cfg(not(any(target_family = "windows", target_os = "macos", target_os = "ios", target_arch = "wasm32", target_env = "ohos")))'.dependencies]
font-kit = { version = "0.14", default-features = false, features = ["source-fontconfig-dlopen"] }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1.10.3"
