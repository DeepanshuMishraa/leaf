[package]
name = "leaf-reader"
version = "0.3.0"
edition = "2024"
description = "Read PDFs, markdown files and web articles in the terminal"
license = "MIT"
repository = "https://github.com/DeepanshuMishraa/leaf"
readme = "README.md"
keywords = ["pdf", "reader", "terminal", "tui", "articles"]
categories = ["command-line-utilities"]
exclude = ["CLAUDE.md", "site"]

[[bin]]
name = "leaf"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
crossterm = "0.29"
dom_smoothie = "0.18"
htmd = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = "0.2"
mupdf = { version = "0.8", default-features = false, features = ["base14-fonts", "system-fonts", "epub", "svg"] }
mupdf-sys = { version = "0.8.0", default-features = false, features = ["epub", "svg"] }
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.30"
ratatui-image = { version = "12.0.0-rc.2", default-features = false, features = ["crossterm"] }
regex = "1"
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
unicode-width = "0.2"
ureq = "3"
url = "2"
ondine = { package = "compiler", git = "https://github.com/wevm/ondine" }
