name: Linux build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:13"]
    steps:
      - uses: actions/checkout@v4

      # The packages the README tells Linux users to install, and no more.
      # fontconfig's development package is left out on purpose: leaf must
      # build without it (issue #3).
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl build-essential pkg-config libclang-dev libasound2-dev
          if pkg-config --exists fontconfig; then
            echo "fontconfig development files are installed; the check below would prove nothing" >&2
            exit 1
          fi

      - name: Install Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build
        run: cargo build --locked

      - name: Run
        run: ./target/debug/leaf --help

      - name: Test
        run: cargo test --locked
